# @file deny.toml
# @description Defines the cargo-deny supply-chain policy for the workspace.
# @created Diego Martín Lafuente <meerita@icloud.com>

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Internal workspace crates depend on each other by path without a version, which
# cargo-deny reports as a wildcard. Registry wildcards stay denied.
allow-wildcard-paths = true
# The ICU4X stack pulls two major lines of the `syn` proc-macro crate: its
# `zerovec` derives build against `syn` 2 while `displaydoc` builds against
# `syn` 3. Both are build-time dependencies internal to ICU4X and cannot be
# aligned from this workspace, so the older line is an accepted duplicate.
skip = [
    { crate = "syn@2", reason = "ICU4X builds against syn 2 (zerovec derives) and syn 3 (displaydoc)" },
    { crate = "thiserror@1", reason = "the i18n-embed embedding stack still builds against thiserror 1" },
    { crate = "thiserror-impl@1", reason = "the i18n-embed embedding stack still builds against thiserror 1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
