# @file Cargo.toml
# @description Defines the virtual workspace and its member packages.
# @created Diego Martín Lafuente <meerita@icloud.com>

[workspace]
resolver = "3"
members = [
    "apps/panther",
    "products/panther/browser",
    "products/panther/localization",
    "engines/purr/embedding",
    "engines/purr/engine",
    "foundation/capability-system",
    "foundation/locale",
]
default-members = ["apps/panther"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
capability-system = { path = "foundation/capability-system" }
fixed_decimal = "0.7"
fluent = "0.17"
fluent-langneg = "0.13"
fluent-syntax = "0.12"
i18n-embed = { version = "0.16", features = ["fluent-system", "rust-embed"] }
i18n-embed-fl = "0.10"
icu = { version = "2.2", features = ["compiled_data"] }
icu_locale = "2.2"
icu_locale_core = "2.2"
locale = { path = "foundation/locale" }
panther-localization = { path = "products/panther/localization" }
rust-embed = "8"
sys-locale = "0.3"
thiserror = "2"
unic-langid = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
